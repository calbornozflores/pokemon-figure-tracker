name: Daily HLJ figure check

on:
  schedule:
    # Single unguarded trigger: 11:00 UTC = 07:00 (CLT) or 08:00 (CLST) Chile time.
    # There used to be two crons plus a step that only proceeded when the Chile-local
    # hour was exactly 08. GitHub dispatches scheduled runs hours late, so from
    # 2026-08-27 to 2026-09-21 that guard skipped every single run - ~50 green,
    # six-second runs that never scraped, and 21 new listings were never reported.
    # Nothing clock-dependent may stand between the trigger and the scrape again.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tracker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: uv run python -m pokemon_figure_tracker

      - name: Commit updated state
        run: |
          git config user.name "pokemon-figure-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_products.json
          git diff --cached --quiet || git commit -m "chore: update seen products"
          git pull --rebase --autostash && git push
