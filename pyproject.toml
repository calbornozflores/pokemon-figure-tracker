[project]
name = "pokemon-figure-tracker"
version = "0.1.0"
description = "Daily email digest of new Pokemon Moncolle / Monster Collection figure listings on HLJ.com"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.scripts]
pokemon-figure-tracker = "pokemon_figure_tracker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_figure_tracker"]

[dependency-groups]
dev = []
